name: MindCode CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Source hygiene
        run: bun run sources:check

      - name: Tests
        run: bun run test

      - name: Coverage gate
        run: bun run coverage:changed

      - name: Build Linux x64
        run: MINDCODE_BUILD_TARGETS=bun-linux-x64 bun run build

      - name: Smoke test
        run: bun run smoke
