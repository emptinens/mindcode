name: MindCode CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Source hygiene
        run: bun run sources:check

      - name: Provider and report privacy contracts
        run: bun test --isolate src/legacyProviderCleanup.test.ts src/commands/status/report.test.ts

      - name: Rust format, lint, and tests
        run: bun run check:rust

      - name: TypeScript and packaging unit tests
        run: bun run test && bun run test:build-bundle && bun run test:native-tui

      - name: Coverage gate
        run: bun run coverage:changed

      - name: Rust daemon interoperability
        run: bun run test:daemon-interop

      - name: Build host bundle and smoke test
        run: bun run build && bun run smoke && bun run test:native-packaging && bun run perf:native-tui

      - name: Verify tracked tree is unchanged
        run: git diff --exit-code

  native:
    name: ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64
            os: macos-13
            bun_target: bun-darwin-x64
          - name: macOS arm64
            os: macos-14
            bun_target: bun-darwin-arm64
          - name: Linux x64
            os: ubuntu-latest
            bun_target: bun-linux-x64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            bun_target: bun-linux-arm64
          - name: Windows x64 fallback
            os: windows-latest
            bun_target: bun-windows-x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build matching CLI and daemon package
        shell: bash
        run: MINDCODE_BUILD_TARGETS=${{ matrix.bun_target }} bun run build

      - name: Verify target-aware package layout
        shell: bash
        run: MINDCODE_BUILD_TARGETS=${{ matrix.bun_target }} bun run test:native-packaging

      - name: Verify native TUI package layout
        if: runner.os != 'Windows'
        shell: bash
        run: MINDCODE_TUI_VALIDATE=1 MINDCODE_TUI_BUILD_TARGETS=${{ matrix.bun_target }} node --test scripts/native-tui.test.mjs
