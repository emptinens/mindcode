name: MindCode CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: "Run consent-gated injection, memory-recall, and TUI performance benchmarks"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: CLI compatibility fixtures
        run: cargo test -p mindcode-native --test cli_fixture --locked

      - name: Supply-chain policy
        run: |
          cargo install cargo-deny --locked
          ./scripts/sbom.sh

      - name: Whitespace policy
        run: git diff --check

      - name: Release build and smoke test (no Bun/Node)
        run: |
          ./scripts/build-native-release.sh
          ./scripts/smoke-native-release.sh

      - name: Generate and verify release checksums
        run: |
          ./scripts/checksum-release.sh
          ./scripts/checksum-release.sh --verify

      - name: Verify tracked tree is unchanged
        run: git diff --exit-code

  owner-approved-benchmarks:
    # Benchmark execution is never part of push/PR CI. The owner must start a
    # workflow_dispatch run and explicitly set run_benchmarks=true.
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MINDCODE_BENCH_APPROVED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt

      - name: Injection ASR benchmark
        run: sh scripts/bench-injection.sh

      - name: TUI frame performance gate
        run: sh scripts/bench-tui-frame.sh

      - name: Memory-v2 retrieval gate
        run: sh scripts/bench-memory-recall.sh
