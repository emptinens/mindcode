[package]
name = "mindcode-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Native terminal renderer for the MindCode UI protocol"

[dependencies]
crossterm = { version = "0.29", features = ["osc52"] }
mindcode-protocol = { path = "../mindcode-protocol" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

[[bin]]
name = "mindcode-tui"
path = "src/main.rs"

[[test]]
name = "interaction_foundation"
path = "src/interaction.rs"

[[test]]
name = "clipboard_foundation"
path = "src/clipboard.rs"
