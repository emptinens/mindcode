[package]
name = "mindcode-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Leader-driven worker orchestration: bounded pool, ownership guard, permission tiers, and scoped tools"

[dependencies]
mindcode-core-tools = { path = "../mindcode-core-tools" }
mindcode-transport = { path = "../mindcode-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["fs", "macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.53", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
