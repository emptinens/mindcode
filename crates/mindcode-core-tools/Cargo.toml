[package]
name = "mindcode-core-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Bounded asynchronous process and read-only local Git core tools"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3.27"
tokio = { version = "1.53", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
