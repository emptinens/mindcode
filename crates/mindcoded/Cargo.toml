[package]
name = "mindcoded"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
libc = "0.2"
mindcode-protocol = { path = "../mindcode-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3.27"
