[package]
name = "mindcode-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Fail-closed HTTP transport for MindCode provider protocols"

[dependencies]
bytes = "1"
futures-util = "0.3"
mindcode-provider = { path = "../mindcode-provider" }
mindcode-vexzy = { path = "../mindcode-vexzy" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt", "io-util", "net", "time"] }
