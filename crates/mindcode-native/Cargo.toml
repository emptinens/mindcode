[package]
name = "mindcode-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Rust-first MindCode native CLI foundation"

[[bin]]
name = "mindcode"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
mindcoded = { path = "../mindcoded" }
mindcode-provider = { path = "../mindcode-provider" }
mindcode-settings = { path = "../mindcode-settings" }
mindcode-tui = { path = "../mindcode-tui" }
mindcode-tui-server = { path = "../mindcode-tui-server" }
mindcode-vexzy = { path = "../mindcode-vexzy" }
serde_json = "1"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
mindcode-protocol = { path = "../mindcode-protocol" }
tempfile = "3.27"
