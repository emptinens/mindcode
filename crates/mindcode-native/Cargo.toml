[package]
name = "mindcode-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Rust-first MindCode native CLI foundation"

[[bin]]
name = "mindcode"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
mindcoded = { path = "../mindcoded" }
mindcode-state = { path = "../mindcode-state" }
mindcode-protocol = { path = "../mindcode-protocol" }
mindcode-provider = { path = "../mindcode-provider" }
mindcode-runtime = { path = "../mindcode-runtime" }
mindcode-settings = { path = "../mindcode-settings" }
mindcode-tui = { path = "../mindcode-tui" }
mindcode-transport = { path = "../mindcode-transport" }
mindcode-tui-server = { path = "../mindcode-tui-server" }
mindcode-worker = { path = "../mindcode-worker" }
serde_json = "1"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3.27"
