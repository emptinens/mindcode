[package]
name = "mindcode-tui-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "In-process control server for the native MindCode TUI"

[dependencies]
mindcode-protocol = { path = "../mindcode-protocol" }
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util", "fs"] }

[dev-dependencies]
tempfile = "3.27"
